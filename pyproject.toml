[project]
name = "django-drf-shop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Павел", email = "Besp.Pavel@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django-debug-toolbar>=8.0.0",
    "django-filter>=26.2",
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "dotenv>=0.9.9",
    "drf-nested-routers>=0.95.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "markdown>=3.11",
    "psycopg2-binary>=2.9.13",
    "wemake-python-styleguide>=1.8.1",
]

[project.scripts]
django-drf-shop = "django_drf_shop:main"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
    "tests/*",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]
