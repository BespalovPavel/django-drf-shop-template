# Ограничение частоты запросов для защиты API от флуда
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;

    client_max_body_size 15M;

    # Внутренний DNS-резолвер Docker (Nginx не падает, если web временно недоступен)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_backend http://web:8000;

    # Gzip-сжатие текстовых данных
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 1. Сборная статика Django (админка, Swagger UI)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 2. Пользовательские загрузки
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Маршрутизация REST API и админки
    location / {
        # Защита от L7-флуда (допускает всплески до 30 запросов)
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass $django_backend;
        proxy_http_version 1.1;

        # Заголовки проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Сквозной Trace-ID для отслеживания пути запроса в логах
        proxy_set_header X-Request-ID $request_id;
        add_header X-Request-ID $request_id always;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}